name: tests
on:
  push: { branches: [main] }
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        numba: ["jit"]
        include:
          - python-version: "3.12"
            numba: "nojit"          # exercise the pure-NumPy fallback path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[numba,dev]"
      - name: pytest
        env:
          NUMBA_DISABLE_JIT: ${{ matrix.numba == 'nojit' && '1' || '0' }}
        run: python -m pytest tests/ -q
